<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roulette de Gaston</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap">
<style>
:root{--bg:#f3f6ea;--card:#ffffff;--fg:#22301a;--muted:#5d6b52;--line:#cfdcb9;--green:#6aa13a;--green-d:#3f7a22;--red:#a3122a;--black:#16181a;--accent:#6aa13a;--accent-fg:#ffffff;--gold:#f3c623}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141a10;--card:#1e2818;--fg:#eaf2dc;--muted:#a8b99a;--line:#3a4a2c;--green:#7fb94a;--green-d:#9fd36a;--red:#c8243e;--black:#0b0c0d;--accent:#7fb94a;--accent-fg:#10180a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a10;--card:#1e2818;--fg:#eaf2dc;--muted:#a8b99a;--line:#3a4a2c;--green:#7fb94a;--green-d:#9fd36a;--red:#c8243e;--black:#0b0c0d;--accent:#7fb94a;--accent-fg:#10180a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Andika,system-ui,sans-serif;margin:0;padding-inline:16px;padding-block:14px 22px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{max-width:1180px;margin:0 auto;display:grid;gap:18px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,3.4vw,34px);color:var(--green-d);text-wrap:balance}
.tools{display:flex;gap:8px}
.chip{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stage{position:relative;width:min(100%,78vh);aspect-ratio:1;margin:0 auto}
.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28));cursor:pointer;touch-action:manipulation}
.pointer{position:absolute;left:50%;top:-5.5%;width:8%;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.hub{position:absolute;left:50%;top:50%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffe36a,var(--gold) 60%,#c99a06);color:#3b2d00;font:inherit;font-weight:700;font-size:clamp(11px,1.9vw,20px);box-shadow:0 4px 10px rgba(0,0,0,.35);cursor:pointer}
.hub:disabled{filter:grayscale(.5);cursor:default}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px;min-width:0}
.lab{margin:0;font-size:14px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.word{margin:0;min-height:1.3em;font-size:clamp(34px,6vw,64px);font-weight:700;line-height:1.15;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.word.empty{color:var(--muted);font-size:clamp(20px,3vw,28px);font-weight:400}
.dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:.3em;vertical-align:.05em;border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:14px;padding:14px 22px;min-height:54px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn:disabled{opacity:.5}
.btn:focus-visible,.chip:focus-visible,.hub:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{border:2px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center}
.fact b{display:block;font-size:20px}
.fact span{font-size:13px;color:var(--muted)}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-size:15px;border-radius:999px;padding:3px 10px;color:#fff}
.hist .r{background:var(--red)}.hist .n{background:var(--black)}
footer{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.stage{width:min(100%,62vh)}}
@media (prefers-reduced-motion: reduce){.wheel{transition:none}}
</style>
<div class="app">
<header><h1>🎡 La roulette de Gaston</h1>
<div class="tools"><button class="chip" id="snd" aria-pressed="true">🔊 Son</button><button class="chip" id="hid" aria-pressed="false">🙈 Mots cachés</button></div></header>
<div class="stage">
<svg class="wheel" id="wheel" viewBox="-205 -205 410 410" role="img" aria-label="Roue de la fortune avec 20 mots"><g id="rot"></g></svg>
<svg class="pointer" viewBox="0 0 40 52" aria-hidden="true"><path d="M20 50 L3 6 Q20 -4 37 6 Z" fill="#f3c623" stroke="#3b2d00" stroke-width="3" stroke-linejoin="round"/></svg>
<button class="hub" id="go" aria-label="Faire tourner la roue">TOURNE</button>
</div>
<section class="panel" aria-live="polite">
<p class="lab">Le mot est…</p>
<p class="word empty" id="word">Place tes jetons sur le plan de jeu, puis fais tourner la roue.</p>
<div class="row"><button class="btn" id="go2">Tourner la roue</button><button class="btn alt" id="chk" disabled>Vérifier</button></div>
<div class="facts" id="facts" hidden></div>
<div><p class="lab">Derniers mots</p><div class="hist" id="hist"></div></div>
</section>
<footer>Roulette d’après la fiche L7-32 « Joue au jeu de roulette avec Gaston » (CLE International). Les enfants jouent avec le plan de jeu papier.</footer>
</div>
<script>
(function(){
var W=[["il veut","r","eu","verbe"],["le feu","n","eu","nom"],["le lieu","r","eu","nom"],["affreux","n","eu","adjectif"],["tu peux","r","eu","verbe"],["dangereux","n","eu","adjectif"],["nerveux","r","eu","adjectif"],["le neveu","n","eu","nom"],["heureux","r","eu","adjectif"],["les bœufs","n","œu","nom"],["les œufs","r","œu","nom"],["le milieu","n","eu","nom"],["je veux","r","eu","verbe"],["le jeu","n","eu","nom"],["le pneu","r","eu","nom"],["le nœud","n","œu","nom"],["bleu","r","eu","adjectif"],["il peut","n","eu","verbe"],["les nœuds","r","œu","nom"],["le feutre","n","eu","nom"]];
var N=W.length,A=360/N,NS="http://www.w3.org/2000/svg",rot=document.getElementById('rot');
var RED=getComputedStyle(document.documentElement).getPropertyValue('--red');
function pt(a,r){var t=a*Math.PI/180;return[(r*Math.sin(t)).toFixed(2),(-r*Math.cos(t)).toFixed(2)];}
function mk(n,at,p){var e=document.createElementNS(NS,n);for(var k in at)e.setAttribute(k,at[k]);if(p)p.appendChild(e);return e;}
mk('circle',{r:201,fill:'#f3c623'},rot);
var wt=[];
W.forEach(function(w,i){var a0=i*A,a1=(i+1)*A,p0=pt(a0,196),p1=pt(a1,196);
 mk('path',{d:'M0 0 L'+p0[0]+' '+p0[1]+' A196 196 0 0 1 '+p1[0]+' '+p1[1]+' Z',fill:w[1]==='r'?'#a3122a':'#16181a',stroke:'#fff',"stroke-width":.6},rot);
 var c=a0+A/2,flip=c>180;
 var t=mk('text',{transform:'rotate('+(flip?c+90:c-90)+')',x:flip?-178:178,y:5.5,"text-anchor":flip?'start':'end',fill:'#fff',"font-size":w[0].length>9?15:17,"font-family":'Andika,sans-serif',"font-weight":700},rot);
 t.textContent=w[0];wt.push(t);});
mk('circle',{r:201,fill:'none',stroke:'#f3c623',"stroke-width":6},rot);
var theta=0,spinning=false,cur=-1,hist=[];
var wordEl=document.getElementById('word'),chk=document.getElementById('chk'),facts=document.getElementById('facts'),histEl=document.getElementById('hist');
var sndOn=true,ac=null;
function tick(){if(!sndOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=900;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.05);o.stop(ac.currentTime+.06);}catch(e){}}
function fan(){if(!sndOn)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach(function(f,i){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.06;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+i*.12+.3);o.stop(ac.currentTime+i*.12+.32);});}catch(e){}}
function setRot(d){rot.setAttribute('transform','rotate('+d+')');}
function spin(){
 if(spinning)return;spinning=true;chk.disabled=true;facts.hidden=true;
 setBtns(true);
 wordEl.className='word empty';wordEl.textContent='La roue tourne…';
 var idx=Math.floor(Math.random()*N),c=idx*A+A/2,jit=(Math.random()-.5)*(A*.6);
 var base=((-c+jit)%360+360)%360,cur0=((theta%360)+360)%360;
 var delta=(base-cur0+360)%360+360*(5+Math.floor(Math.random()*3));
 var start=theta,dur=5200+Math.random()*1200,t0=null,lastSeg=-1;
 function f(ts){if(t0===null)t0=ts;var p=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-p,3.4);theta=start+delta*e;setRot(theta);
  var seg=Math.floor((((-theta)%360+360)%360)/A);if(seg!==lastSeg){if(lastSeg!==-1)tick();lastSeg=seg;}
  if(p<1)requestAnimationFrame(f);else done(idx);}
 requestAnimationFrame(f);
}
function done(idx){spinning=false;cur=idx;setBtns(false);var w=W[idx];
 wordEl.className='word';wordEl.innerHTML='<span class="dot" style="background:'+(w[1]==='r'?'#a3122a':'#16181a')+'"></span>'+w[0];
 chk.disabled=false;chk.textContent='Vérifier';fan();
 hist.unshift(idx);hist=hist.slice(0,8);histEl.innerHTML=hist.map(function(i){return '<span class="'+W[i][1]+'">'+W[i][0]+'</span>';}).join('');
 if(document.getElementById('hid').getAttribute('aria-pressed')==='true')wordEl.textContent=w[0];}
function setBtns(b){document.getElementById('go').disabled=b;document.getElementById('go2').disabled=b;}
chk.addEventListener('click',function(){if(cur<0)return;var w=W[cur];
 facts.hidden=!facts.hidden;chk.textContent=facts.hidden?'Vérifier':'Cacher';
 facts.innerHTML='<div class="fact"><b>'+w[2]+'</b><span>'+(w[2]==='œu'?'2 points':'1 point')+'</span></div><div class="fact"><b>'+(w[1]==='r'?'rouge':'noir')+'</b><span>1 point</span></div><div class="fact"><b>'+w[3]+'</b><span>3 points</span></div><div class="fact"><b>'+w[0]+'</b><span>20 points</span></div>';});
document.getElementById('go').addEventListener('click',spin);
document.getElementById('go2').addEventListener('click',spin);
document.getElementById('wheel').addEventListener('click',spin);
document.getElementById('snd').addEventListener('click',function(e){sndOn=!sndOn;e.currentTarget.setAttribute('aria-pressed',String(sndOn));e.currentTarget.textContent=sndOn?'🔊 Son':'🔇 Son';});
document.getElementById('hid').addEventListener('click',function(e){var on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));wt.forEach(function(t){t.style.opacity=on?0:1;});});
})();
</script>
</html>
