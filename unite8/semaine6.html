:root{--or:#d9692a;--tq:#a8234f;--tq2:#3a63b8;--ye:#fdebd9;--bg:#fff;--ink:#2d3735;--ok:#2e9d57;--ko:#d64545;--sc:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:calc(18px*var(--sc));-webkit-user-select:none;user-select:none}
body.beamer{--sc:1.35}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,var(--tq2),var(--tq));color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font:700 1.15em 'Baloo 2';margin:0;flex:1;min-width:150px}
header button{font:600 .8em 'Baloo 2';border:0;border-radius:999px;padding:7px 14px;background:#fff;color:var(--tq);cursor:pointer}
main{max-width:980px;margin:0 auto;padding:14px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{border:4px solid var(--or);border-radius:22px;background:#fff;padding:16px;text-align:center;font:600 1em 'Baloo 2';cursor:pointer;box-shadow:0 5px 0 rgba(255,122,61,.2)}
.tile .ic{font-size:2em;display:block}.tile small{display:block;font:500 .7em 'Nunito';color:#666;margin-top:4px}
.card{border:4px solid var(--or);border-radius:24px;padding:16px;background:#fff;box-shadow:0 5px 0 rgba(255,122,61,.18)}
.prompt{font:600 1.25em 'Baloo 2';text-align:center;margin:6px 0 14px;line-height:1.5}
.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--or);color:var(--tq);padding:0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{font:600 1em 'Baloo 2';border:3px solid var(--tq2);border-radius:16px;background:#f2fbf9;padding:12px 8px;cursor:pointer;min-height:56px}
.opt.good{background:#d9f5e2;border-color:var(--ok)}.opt.bad{background:#fde0e0;border-color:var(--ko)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:600 .85em 'Baloo 2';color:var(--tq);gap:8px;flex-wrap:wrap}
.pill{background:var(--ye);color:#5a4300;border-radius:999px;padding:4px 12px}
.fb{min-height:2.6em;text-align:center;font:600 1em 'Baloo 2';margin-top:10px}
.fb.good{color:var(--ok)}.fb.bad{color:var(--ko)}
.btn{font:600 1em 'Baloo 2';border:0;border-radius:999px;background:var(--or);color:#fff;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.sec{background:var(--tq)}.center{text-align:center;margin-top:12px}

/* ---------- Quiz-Engine ---------- */
function quiz({ruleHtml="",rounds,onSpeak}){
 let i=0,score=0,locked=false;
 function show(){
  if(i>=rounds.length){const st=score>=rounds.length*.9?3:score>=rounds.length*.6?2:1;
   app.innerHTML=`<div class="card"><div class="end">${score} / ${rounds.length}<div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div></div><div class="center"><button class="btn" id="again">Rejouer</button> <button class="btn sec" onclick="go('')">Menu</button></div></div>`;
   $("#again").onclick=()=>{i=0;score=0;rounds=shuffle(rounds);show()};return}
  const r=rounds[i];locked=false;
  app.innerHTML=`<div class="card"><div class="bar"><span>Question ${i+1} / ${rounds.length}</span><span class="pill">★ ${score}</span></div>${ruleHtml}<div class="prompt">${r.prompt}</div><div class="opts">${shuffle(r.options).map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(locked)return;const ok=b.dataset.o===r.answer;
   if(ok){locked=true;b.classList.add("good");score++;$("#fb").className="fb good";$("#fb").textContent="Bravo ! "+(r.full||r.answer);say(r.say||r.full||r.answer);setTimeout(()=>{i++;show()},1700)}
   else{b.classList.add("bad");$("#fb").className="fb bad";$("#fb").textContent="Pas tout à fait… essaie encore !";score=Math.max(0,score-0)}
  });
  if(r.speakFirst)say(r.speakFirst);
 }
 show();
}

  if(i>=order.length){app.innerHTML=`<div class="card"><div class="end">${score} / ${order.length}<div class="stars">${"★".repeat(score>=9?3:score>=6?2:1)}</div></div><div class="center"><button class="btn" onclick="route()">Rejouer</button></div></div>`;return}
  const s=order[i],words=s.split(" ");let chosen=[];
  let sh=shuffle(words.map((w,k)=>({w,k})));if(sh.map(x=>x.w).join(" ")===s)sh.reverse();
  const render=()=>{
   app.innerHTML=`<div class="card"><div class="bar"><span>Phrase ${i+1} / ${order.length}</span><span class="pill">★ ${score}</span></div><div class="prompt">Remets les mots dans l'ordre</div><div class="answer" id="ans">${chosen.map(c=>`<span class="chip" data-k="${c.k}" data-a="1">${esc(c.w)}</span>`).join("")}</div><div class="chips" id="pool">${sh.map(c=>`<span class="chip ${chosen.some(x=>x.k===c.k)?"used":""}" data-k="${c.k}">${esc(c.w)}</span>`).join("")}</div><div class="fb" id="fb"></div><div class="center"><button class="btn sec" id="clr">Effacer</button> <button class="btn" id="chk">Vérifier</button></div></div>`;
   $("#pool").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{chosen.push(sh.find(x=>x.k==c.dataset.k));render()});
   $("#ans").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{chosen=chosen.filter(x=>x.k!=c.dataset.k);render()});
   $("#clr").onclick=()=>{chosen=[];render()};
   $("#chk").onclick=()=>{const t=chosen.map(c=>c.w).join(" ");
    if(t===s){$("#fb").className="fb good";$("#fb").textContent="Bravo ! "+s;say(s);score++;setTimeout(()=>{i++;show()},1900)}
    else{$("#fb").className="fb bad";$("#fb").textContent=chosen.length<words.length?"Il manque des mots.":"Pas tout à fait… regarde encore !"}};
  };
  render();
 }
 show();
}


function lecture(){
 const rounds=[];
 READS.forEach(r=>r.qs.forEach(q=>rounds.push({prompt:'<div class="rule" style="font-weight:600;text-align:left">'+esc(r.text)+'</div><b>'+esc(q.q)+'</b>',options:q.opts,answer:q.opts[q.correct],full:q.opts[q.correct],say:q.opts[q.correct]})));
 quiz({rounds:pick(rounds,Math.min(8,rounds.length))});
}

route();
</script>
