:root{--or:#d9692a;--tq:#a8234f;--tq2:#3a63b8;--ye:#fdebd9;--bg:#fff;--ink:#2d3735;--ok:#2e9d57;--ko:#d64545;--sc:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:calc(18px*var(--sc));-webkit-user-select:none;user-select:none}
body.beamer{--sc:1.35}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,var(--tq2),var(--tq));color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font:700 1.15em 'Baloo 2';margin:0;flex:1;min-width:150px}
header button{font:600 .8em 'Baloo 2';border:0;border-radius:999px;padding:7px 14px;background:#fff;color:var(--tq);cursor:pointer}
main{max-width:980px;margin:0 auto;padding:14px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tile{border:4px solid var(--or);border-radius:22px;background:#fff;padding:16px;text-align:center;font:600 1em 'Baloo 2';cursor:pointer;box-shadow:0 5px 0 rgba(255,122,61,.2)}
.tile .ic{font-size:2em;display:block}.tile small{display:block;font:500 .7em 'Nunito';color:#666;margin-top:4px}
.card{border:4px solid var(--or);border-radius:24px;padding:16px;background:#fff;box-shadow:0 5px 0 rgba(255,122,61,.18)}
.prompt{font:600 1.25em 'Baloo 2';text-align:center;margin:6px 0 14px;line-height:1.5}
.prompt .gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--or);color:var(--tq);padding:0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{font:600 1em 'Baloo 2';border:3px solid var(--tq2);border-radius:16px;background:#f2fbf9;padding:12px 8px;cursor:pointer;min-height:56px}
.opt.good{background:#d9f5e2;border-color:var(--ok)}.opt.bad{background:#fde0e0;border-color:var(--ko)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:600 .85em 'Baloo 2';color:var(--tq);gap:8px;flex-wrap:wrap}
.pill{background:var(--ye);color:#5a4300;border-radius:999px;padding:4px 12px}
.fb{min-height:2.6em;text-align:center;font:600 1em 'Baloo 2';margin-top:10px}
.fb.good{color:var(--ok)}.fb.bad{color:var(--ko)}
.btn{font:600 1em 'Baloo 2';border:0;border-radius:999px;background:var(--or);color:#fff;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.sec{background:var(--tq)}.center{text-align:center;margin-top:12px}
.rule{background:#fff8e1;border:2px dashed var(--ye);border-radius:14px;padding:8px 12px;font-size:.8em;margin-bottom:10px}
.facebox{display:flex;justify-content:center}.facebox svg{width:min(420px,78vw);height:auto}
.hot{fill:rgba(255,122,61,0);cursor:pointer}.hot:active,.hot.sel{fill:rgba(255,122,61,.4)}
.big{font:700 1.7em 'Baloo 2';text-align:center;min-height:1.5em;color:var(--tq)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0;min-height:52px}
.chip{font:600 1em 'Baloo 2';border:3px solid var(--or);border-radius:12px;background:#fff;padding:8px 12px;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.answer{min-height:58px;border:3px dashed var(--tq2);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.fc{border:4px solid #e8e0d0;border-radius:18px;padding:6px;text-align:center;background:#fff;cursor:pointer;font:600 .8em 'Baloo 2'}
.fc svg{width:84px;height:84px}.fc.good{border-color:var(--ok);background:#d9f5e2}.fc.bad{border-color:var(--ko);background:#fde0e0}
.say{background:none;border:0;font-size:1.3em;cursor:pointer;vertical-align:middle}
.teams{display:none;gap:8px}.beamer .teams{display:flex}
.team{background:#fff;color:var(--tq);border-radius:999px;padding:3px 10px;font:600 .8em 'Baloo 2';display:flex;gap:6px;align-items:center}
.team button{padding:2px 9px;font-size:1em}
.end{text-align:center;font:700 1.4em 'Baloo 2';padding:20px 0}
.stars{font-size:2em;color:var(--or)}

/* Buchdesign */
header{background:#fff !important;color:var(--or) !important;border-bottom:6px solid var(--or);position:sticky;padding:8px 14px 10px}
header::after{content:"";position:absolute;right:0;bottom:-18px;border-left:16px solid transparent;border-top:12px solid var(--or)}
header::before{content:"";position:absolute;left:0;bottom:-18px;border-right:16px solid transparent;border-top:12px solid var(--or)}
header h1{color:var(--or);font-size:1.5em}
header button{background:var(--or) !important;color:#fff !important}
.team{background:#fdebd9 !important;color:var(--or) !important}
.tile,.card{border-width:2px !important;border-radius:14px !important;box-shadow:1px 3px 0 #f3c9b0 !important}
.tile{font-family:'Baloo 2'}
.prompt{font-family:'Nunito';font-weight:700}
.prompt .gap{color:var(--tq);border-bottom-width:3px}
.opt{border:2px solid var(--or) !important;background:#fff !important;font-family:'Nunito';font-weight:700;border-radius:12px !important}
.opt.good{background:#d9f5e2 !important;border-color:var(--ok) !important}.opt.bad{background:#fde0e0 !important;border-color:var(--ko) !important}
.btn,.btn.sec{background:var(--or) !important;font-family:'Baloo 2'}
.rule{background:#fff !important;border:1.6px solid var(--or) !important;border-radius:12px !important}
.answer{border:2px dashed var(--or) !important}
.chip{border:2px solid var(--or) !important}
.big{color:var(--tq)}
.bar{color:var(--or)}
.pill{background:#fdebd9;color:var(--or)}
main{padding-top:26px}

.bodybox svg{width:min(250px,60vw);height:auto}.hot{fill:rgba(217,105,42,0);cursor:pointer}.hot line{stroke:rgba(217,105,42,0)}.hot:active,.hot.sel{fill:rgba(217,105,42,.4)}.hot:active line{stroke:rgba(217,105,42,.4)}

.solo .teams,.solo #bbtn,.solo header button,.solo [onclick="go('')"]{display:none !important}
</style>

const READS=[{"text":"Mamie est tombée dans les escaliers. Elle a très mal à la jambe. Papy appelle les secours. Les enfants sont inquiets. Camille dit : « Mamie, tu as mal où ? » Mamie répond : « J'ai mal à la jambe et à l'épaule. » Les enfants restent avec Mamie.","qs":[{"q":"Où Mamie est-elle tombée ?","opts":["dans les escaliers","dans le jardin","dans la cuisine"],"correct":0},{"q":"Où Mamie a-t-elle mal ?","opts":["à la jambe et à l'épaule","à la tête","aux dents"],"correct":0}]},{"text":"Dans la galerie des ancêtres, Somia et Sophie regardent les tableaux. Le monsieur aux cheveux gris a une moustache et un chapeau. Il ressemble à tante Célestine ! Le monsieur sans cheveux ressemble à Monsieur Pedro. La dame porte une jolie robe et des lunettes. Somia rit : « Ils sont rigolos ! »","qs":[{"q":"Où sont Somia et Sophie ?","opts":["dans la galerie des ancêtres","chez le médecin","à la piscine"],"correct":0},{"q":"Qui a une moustache et un chapeau ?","opts":["le monsieur aux cheveux gris","la dame","Monsieur Pedro"],"correct":0}]},{"text":"Hugo est dans la salle d'attente. Il a mal aux dents et il a mal à la tête. L'infirmier appelle : « Hugo ! » Hugo entre chez le médecin. Le médecin regarde ses dents. Il dit : « Tu manges trop de bonbons ! » Hugo rit, mais il a peur.","qs":[{"q":"Où Hugo a-t-il mal ?","opts":["au dos","aux dents et à la tête","au pied"],"correct":1},{"q":"Qui appelle Hugo ?","opts":["la maman","l'infirmier","Tom"],"correct":1}]}];
/* ---------- Hilfsfunktionen ---------- */
const $=s=>document.querySelector(s), app=$("#app");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/___/g,"…"));u.lang="fr-FR";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
window.say=say;

/* Teams (Beamer) */
const T={a:0,b:0};
function team(k,d){T[k]=Math.max(0,T[k]+d);$("#t"+k).textContent=T[k]}
function toggleBeamer(){document.body.classList.toggle("beamer");$("#bbtn").textContent=document.body.classList.contains("beamer")?"iPad":"Beamer"}


/* ---------- Menü & Routing ---------- */
const MODES={
 vocab:{t:"Vocab-Trainer",ic:"📚",d:"Deutsch → Français",f:vocab},
 g1:{t:"au, à la, à l', aux",ic:"🩹",d:"mal + au / à la / à l' / aux",f:()=>gap('g1')},
 g2:{t:"La galerie des ancêtres",ic:"🖼️",d:"cheveux, moustache, lunettes…",f:()=>gap('g2')},
 g3:{t:"Qui porte quoi ?",ic:"👗",d:"porter + les vêtements",f:()=>gap('g3')},
 order:{t:"Remets dans l'ordre",ic:"🧩",d:"Construis la phrase",f:()=>{PH_SRC=null;phrases()}},
 read:{t:"Lecture : Mamie est tombée",ic:"📖",d:"Lis et réponds",f:()=>lecture()},
 extra:{t:"Défi mix",ic:"🎯",d:"Tous les types mélangés",f:defi},
 medecin:{t:"Où as-tu mal ?",ic:"🧍",d:"Touche, écoute, dis",f:medecin},
 b1:{h:1,t:"Où a-t-il mal ?",f:()=>gap('b1')},b2:{h:1,t:"Qui porte quoi ?",f:()=>gap('b2')},b3:{h:1,t:"Les verbes en -er",f:()=>gap('b3')},ordA:{h:1,t:"Remets les mots dans l'ordre",f:()=>{PH_SRC=PH_A;phrases()}},ra:{h:1,t:"Lecture",f:()=>lecture([0])},rb:{h:1,t:"Lecture",f:()=>lecture([1])}};
const SOLO=/[?&]solo=1/.test(location.search);
function go(m){if(SOLO)return;location.hash=m;route()}
function route(){
 try{speechSynthesis.cancel()}catch(e){}
 const m=location.hash.replace("#","");
 if(SOLO){document.body.classList.add("solo");if(!MODES[m]){$("#title").textContent="Le Cabinet du Docteur";app.innerHTML='<p class="prompt">Scanne le code QR sur ta feuille. 📷</p>';return}}
 if(MODES[m]){$("#title").textContent=MODES[m].t;MODES[m].f()}
 else{$("#title").textContent="Le Cabinet du Docteur";
  app.innerHTML='<p class="prompt">Choisis un jeu !</p><div class="menu">'+Object.entries(MODES).filter(([k,v])=>!v.h).map(([k,v])=>'<div class="tile" onclick="go(\''+k+'\')"><span class="ic">'+v.ic+'</span>'+v.t+'<small>'+v.d+'</small></div>').join("")+'</div><p style="text-align:center;font-size:.7em;color:#888;margin-top:20px">Unité 8 · En pleine forme · Partie 3 · Aïe, j\'ai mal !</p>'}
}
window.addEventListener("hashchange",route);
/* ---------- Quiz-Engine ---------- */
function quiz({ruleHtml="",rounds,onSpeak}){
 let i=0,score=0,locked=false;
 function show(){
  if(i>=rounds.length){const st=score>=rounds.length*.9?3:score>=rounds.length*.6?2:1;
   app.innerHTML=`<div class="card"><div class="end">${score} / ${rounds.length}<div class="stars">${"★".repeat(st)}${"☆".repeat(3-st)}</div></div><div class="center"><button class="btn" id="again">Rejouer</button> <button class="btn sec" onclick="go('')">Menu</button></div></div>`;
   $("#again").onclick=()=>{i=0;score=0;rounds=shuffle(rounds);show()};return}
  const r=rounds[i];locked=false;
  app.innerHTML=`<div class="card"><div class="bar"><span>Question ${i+1} / ${rounds.length}</span><span class="pill">★ ${score}</span></div>${ruleHtml}<div class="prompt">${r.prompt}</div><div class="opts">${shuffle(r.options).map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(locked)return;const ok=b.dataset.o===r.answer;
   if(ok){locked=true;b.classList.add("good");score++;$("#fb").className="fb good";$("#fb").textContent="Bravo ! "+(r.full||r.answer);say(r.say||r.full||r.answer);setTimeout(()=>{i++;show()},1700)}
   else{b.classList.add("bad");$("#fb").className="fb bad";$("#fb").textContent="Pas tout à fait… essaie encore !";score=Math.max(0,score-0)}
  });
  if(r.speakFirst)say(r.speakFirst);
 }
 show();
}


const GAP='<span class="gap">&nbsp;&nbsp;?&nbsp;&nbsp;</span>';
function gapRound(it){return {prompt:esc(it.t).replace("___",GAP),options:it.o.length>5?pick(it.o.filter(x=>x!==it.a),3).concat([it.a]):it.o,answer:it.a,full:it.full,say:it.full}}
function gap(k){
 const rule=RULE[k]?'<div class="rule">'+esc(RULE[k])+'</div>':"";
 quiz({ruleHtml:rule,rounds:pick(G[k],10).map(gapRound)});
}
function defi(){quiz({rounds:pick([...G.g1,...G.g2,...G.g3],12).map(gapRound)})}
function vocab(){
 app.innerHTML='<div class="card"><p class="prompt">Choisis la direction</p><div class="center"><button class="btn" id="d1">Deutsch → Français</button></div><div class="center"><button class="btn sec" id="d2">Français → Deutsch</button></div></div>';
 const start=dir=>{
  const items=pick(VOC,10);
  quiz({rounds:items.map(([de,fr])=>{
   const wrong=pick(VOC.filter(x=>x[1]!==fr),3);
   return dir==1?{prompt:"<b>"+de+"</b>",options:[fr,...wrong.map(x=>x[1])],answer:fr,full:fr,say:fr}
                :{prompt:"<b>"+fr+'</b> <button class="say" onclick="say(\''+fr.replace(/'/g,"\\'")+'\')">🔊</button>',options:[de,...wrong.map(x=>x[0])],answer:de,full:fr+" = "+de,say:fr,speakFirst:fr};
  })});
 };
 $("#d1").onclick=()=>start(1);$("#d2").onclick=()=>start(2);
}
/* ---------- Modus 6: Phrases ---------- */
function phrases(){
 const sents=pick(PH_SRC||PH_ALL,10);
 let i=0,score=0,order=shuffle(sents);
 function show(){
  if(i>=order.length){app.innerHTML=`<div class="card"><div class="end">${score} / ${order.length}<div class="stars">${"★".repeat(score>=9?3:score>=6?2:1)}</div></div><div class="center"><button class="btn" onclick="route()">Rejouer</button></div></div>`;return}
  const s=order[i],words=s.split(" ");let chosen=[];
  let sh=shuffle(words.map((w,k)=>({w,k})));if(sh.map(x=>x.w).join(" ")===s)sh.reverse();
  const render=()=>{
   app.innerHTML=`<div class="card"><div class="bar"><span>Phrase ${i+1} / ${order.length}</span><span class="pill">★ ${score}</span></div><div class="prompt">Remets les mots dans l'ordre</div><div class="answer" id="ans">${chosen.map(c=>`<span class="chip" data-k="${c.k}" data-a="1">${esc(c.w)}</span>`).join("")}</div><div class="chips" id="pool">${sh.map(c=>`<span class="chip ${chosen.some(x=>x.k===c.k)?"used":""}" data-k="${c.k}">${esc(c.w)}</span>`).join("")}</div><div class="fb" id="fb"></div><div class="center"><button class="btn sec" id="clr">Effacer</button> <button class="btn" id="chk">Vérifier</button></div></div>`;
   $("#pool").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{chosen.push(sh.find(x=>x.k==c.dataset.k));render()});
   $("#ans").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{chosen=chosen.filter(x=>x.k!=c.dataset.k);render()});
   $("#clr").onclick=()=>{chosen=[];render()};
   $("#chk").onclick=()=>{const t=chosen.map(c=>c.w).join(" ");
    if(t===s){$("#fb").className="fb good";$("#fb").textContent="Bravo ! "+s;say(s);score++;setTimeout(()=>{i++;show()},1900)}
    else{$("#fb").className="fb bad";$("#fb").textContent=chosen.length<words.length?"Il manque des mots.":"Pas tout à fait… regarde encore !"}};
  };
  render();
 }
 show();
}


function lecture(idx){
 const rounds=[];
 READS.filter((r,i)=>!idx||idx.includes(i)).forEach(r=>r.qs.forEach(q=>rounds.push({prompt:'<div class="rule" style="font-weight:600;text-align:left">'+esc(r.text)+'</div><b>'+esc(q.q)+'</b>',options:q.opts,answer:q.opts[q.correct],full:q.opts[q.correct],say:q.opts[q.correct]})));
 quiz({rounds:pick(rounds,Math.min(8,rounds.length))});
}

function medecin(){
 let mode="explore",target=null,score=0,n=0;const P=BODY_PARTS;
 const mal=fr=>fr.startsWith("le ")?"au "+fr.slice(3):fr.startsWith("la ")?"à la "+fr.slice(3):fr.startsWith("l'")?"à l'"+fr.slice(2):"aux "+fr.slice(4);
 const say2=p=>"J'ai mal "+mal(p.fr)+" !";
 function draw(){
  app.innerHTML='<div class="card"><div class="bar"><span>'+(mode=="explore"?"Touche une partie du corps":"Le patient dit : <b>"+say2(target)+"</b>")+'</span><span class="pill">★ '+score+'</span></div><div class="facebox bodybox">'+bodySvg({hot:true})+'</div><div class="big" id="lab">&nbsp;</div><div class="fb" id="fb"></div><div class="center"><button class="btn sec" id="m1">Explorer</button> <button class="btn" id="m2">Jeu : où a-t-il mal ?</button></div></div>';
  app.querySelectorAll("g[data-p]").forEach(g=>g.onclick=()=>hit(P.find(x=>x.id===g.dataset.p)));
  $("#m1").onclick=()=>{mode="explore";score=0;draw()};
  $("#m2").onclick=()=>{mode="quiz";score=0;n=0;next()};
 }
 function hit(p){
  if(mode=="explore"){$("#lab").textContent=say2(p);say(say2(p));return}
  if(p.id===target.id){$("#fb").className="fb good";$("#fb").textContent="Bravo ! "+say2(p);say(say2(p));score++;n++;setTimeout(()=>n>=10?end():next(),1300)}
  else{$("#fb").className="fb bad";$("#fb").textContent="Non, ça c'est "+p.fr+". Écoute encore !";say(say2(target))}
 }
 function next(){target=pick(P.filter(x=>!target||x.id!==target.id),1)[0];draw();say(say2(target))}
 function end(){app.innerHTML='<div class="card"><div class="end">'+score+' / 10<div class="stars">'+"★".repeat(score>=9?3:score>=6?2:1)+'</div></div><div class="center"><button class="btn" onclick="route()">Rejouer</button></div></div>'}
 draw();
}
route();
</script>
