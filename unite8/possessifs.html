<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Les possessifs – Unité 8, partie 2</title>
<style>:root{--or:#d9692a;--bl:#3a63b8;--pk:#a8234f;--ok:#2e9d57;--ko:#d64545}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:18px/1.4 'Andika','Nunito',system-ui,sans-serif;color:#2d3735;background:#fff;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,var(--bl),var(--pk));color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:1.05em;margin:0;flex:1}header button{border:0;border-radius:999px;padding:7px 14px;background:#fff;color:var(--pk);font:inherit;font-size:.8em;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{border:4px solid var(--or);border-radius:22px;padding:16px;text-align:center;font-weight:700;cursor:pointer}
.card{border:4px solid var(--or);border-radius:24px;padding:16px}.prompt{font-size:1.3em;text-align:center;margin:8px 0 16px;font-weight:700}
.gap{display:inline-block;min-width:3em;border-bottom:4px solid var(--or);color:var(--pk)}.who{color:#777;font-size:.75em;display:block;font-weight:400}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.opt{font:inherit;font-weight:700;border:3px solid var(--bl);border-radius:16px;background:#f3f7ff;padding:12px 8px;min-height:56px;cursor:pointer}
.opt.good{background:#d9f5e2;border-color:var(--ok)}.opt.bad{background:#fde0e0;border-color:var(--ko)}
.bar{display:flex;justify-content:space-between;color:var(--bl);font-weight:700;margin-bottom:8px}.fb{min-height:2.6em;text-align:center;font-weight:700;margin-top:10px}.fb.good{color:var(--ok)}.fb.bad{color:var(--ko)}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--or);color:#fff;padding:10px 22px;cursor:pointer}.center{text-align:center;margin-top:12px}
.pic{display:block;margin:0 auto 6px;height:150px;max-width:90%;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0;min-height:52px}.chip{border:3px solid var(--or);border-radius:12px;background:#fff;padding:8px 12px;font:inherit;font-weight:700;cursor:pointer}.chip.used{opacity:.25;pointer-events:none}
.answer{min-height:58px;border:3px dashed var(--bl);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.big{font-size:1.6em;text-align:center;font-weight:700;color:var(--bl)}body.solo #back{display:none}</style></head><body>

const SOLO=/[?&]solo=1/.test(location.search);const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const GAP='<span class="gap">&nbsp;&nbsp;?&nbsp;&nbsp;</span>';
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";speechSynthesis.speak(u)}catch(e){}}
function run(rounds,render,check){ /* generische Quiz-Schleife */
  let i=0,score=0;
  const show=()=>{if(i>=rounds.length){app.innerHTML='<div class="card"><p class="prompt">'+(score>=rounds.length*.8?"Bravo ! 🎉":"Continue ! 💪")+'</p><p class="big">'+score+' / '+rounds.length+'</p><div class="center"><button class="btn" id="again">Encore une fois</button></div></div>';document.getElementById("again").onclick=()=>route();return}
    app.innerHTML='<div class="card"><div class="bar"><span>Question '+(i+1)+' / '+rounds.length+'</span><span>⭐ '+score+'</span></div>'+render(rounds[i])+'<div class="fb" id="fb"></div></div>';
    check(rounds[i],(ok,msg,say_)=>{const fb=document.getElementById("fb");fb.className="fb "+(ok?"good":"bad");fb.textContent=msg;if(ok)score++;if(say_)say(say_);setTimeout(()=>{i++;show()},ok?900:1900)})};
  show();
}
function choice(k){
  const rounds=shuf(D[k]).slice(0,10);
  run(rounds,r=>{let h="";if(r.img)h+='<img class="pic" src="'+r.img+'">';
    h+='<p class="prompt">'+(r.img?'<span class="who">('+esc(r.who)+')</span>'+GAP+' '+esc(r.n):(r.who?'<span class="who">('+esc(r.who)+')</span>':"")+esc(r.t).replace("___",GAP))+'</p><div class="opts">'+shuf(r.o).map(o=>'<button class="opt">'+esc(r.t&&r.t.startsWith("___")?o[0].toUpperCase()+o.slice(1):o)+'</button>').join("")+'</div>';return h},
   (r,done)=>{let locked=false;[...app.querySelectorAll(".opt")].forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const v=b.textContent.toLowerCase(),ok=v===r.a.toLowerCase();b.classList.add(ok?"good":"bad");if(!ok)[...app.querySelectorAll(".opt")].find(x=>x.textContent.toLowerCase()===r.a.toLowerCase()).classList.add("good");
     const full=r.img?r.a+" "+r.n:r.t.replace("___",r.a);done(ok,ok?"Super !":"C'est : "+r.a,full)})});
}
function juste(){
  const rounds=shuf(D.t5).slice(0,10);
  run(rounds,r=>'<p class="prompt">'+esc(r.t)+'</p><div class="opts"><button class="opt" data-v="1">✔ juste</button><button class="opt" data-v="0">✘ faux</button></div>',
   (r,done)=>{let locked=false;[...app.querySelectorAll(".opt")].forEach(b=>b.onclick=()=>{if(locked)return;locked=true;const ok=(b.dataset.v==="1")===r.ok;b.classList.add(ok?"good":"bad");done(ok,ok?(r.ok?"Oui, c'est juste !":"Oui ! Il faut : "+r.a):(r.ok?"C'est juste !":"C'est faux : il faut "+r.a),r.ok?r.t:null)})});
}
function order(){
  const rounds=shuf(D.t6).slice(0,8);
  run(rounds,s=>{const w=shuf(s.replace(/\.$/,"").split(" "));return '<p class="prompt">Remets les mots dans l\'ordre</p><div class="answer" id="ans"></div><div class="chips" id="ch">'+w.map((x,i)=>'<button class="chip" data-i="'+i+'">'+esc(x)+'</button>').join("")+'</div><div class="center"><button class="btn" id="chk">Vérifier</button> <button class="btn" id="clr" style="background:var(--bl)">↺</button></div>'},
   (s,done)=>{const target=s.replace(/\.$/,"");let cur=[];const ans=document.getElementById("ans"),chips=[...document.querySelectorAll(".chip")];
    chips.forEach(c=>c.onclick=()=>{cur.push(c.textContent);c.classList.add("used");ans.textContent=cur.join(" ")});
    document.getElementById("clr").onclick=()=>{cur=[];chips.forEach(c=>c.classList.remove("used"));ans.textContent=""};
    document.getElementById("chk").onclick=()=>{const ok=cur.join(" ")===target;done(ok,ok?"Bravo !":"C'est : "+s,s)}});
}
const MODES={t1:()=>choice("t1"),t2:()=>choice("t2"),t3:()=>choice("t3"),t4:()=>choice("t4"),t5:juste,t6:order,t7:()=>choice("t7")};
function route(){try{speechSynthesis.cancel()}catch(e){}
  const m=location.hash.replace("#","");if(SOLO)document.body.classList.add("solo");
  if(MODES[m]){document.getElementById("title").textContent=TITLES[m];MODES[m]()}
  else{document.getElementById("title").textContent="Les possessifs";
   if(SOLO){app.innerHTML='<p class="prompt">Scanne le code QR sur ta feuille. 📷</p>';return}
   app.innerHTML='<p class="prompt">Choisis un jeu !</p><div class="menu">'+Object.keys(MODES).map((k,i)=>'<div class="tile" onclick="location.hash=\''+k+'\'">'+(i+1)+'. '+TITLES[k]+'</div>').join("")+'</div><p style="text-align:center;font-size:.7em;color:#888;margin-top:20px">Unité 8 · En pleine forme · Partie 2</p>'}}
addEventListener("hashchange",route);route();
</script></body></html>
