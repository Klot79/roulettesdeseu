<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeux de vocabulaire – Unité 8</title>
<style>:root{--c:#35b3a3;--o:#e8833a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f4fbf9;color:#333}header{background:var(--c);color:#fff;padding:12px 16px;font-weight:700;font-size:20px}main{max-width:820px;margin:auto;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button{font:inherit;border:2px solid var(--c);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}button.on{background:var(--c);color:#fff}button.big{font-size:18px;padding:14px 18px}.tile{flex:1 1 150px;text-align:center;border-radius:16px;padding:16px 8px;font-size:17px}.card{border-radius:14px;min-height:74px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:16px;border:2px solid var(--c);background:#fff;cursor:pointer;user-select:none}.card.back{background:var(--c);color:var(--c);font-size:26px}.card.back::after{content:"?";color:#fff}.card.done{opacity:.35;pointer-events:none}.card.sel{outline:4px solid var(--o)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.q{font-size:26px;font-weight:700;text-align:center;margin:14px 0}.ok{background:#bfe8c0!important}.no{background:#f7c0bd!important}.msg{text-align:center;font-size:22px;font-weight:700;margin:10px}.letters button{width:42px;padding:8px 0}input[type=text]{font:inherit;font-size:20px;padding:10px;border:2px solid var(--c);border-radius:12px;width:100%}.small{font-size:13px;color:#666}</style></head><body>
<header>🎲 Jeux de vocabulaire · Unité 8</header><main><div id="app"></div></main>
<script>
const DATA=[{"n":1,"name":"Une journée de bien-être","v":[["der Kopf","la tête"],["die Haare","les cheveux"],["das Auge","l'œil"],["die Nase","le nez"],["der Mund","la bouche"],["das Ohr","l'oreille"],["der Hals","le cou"],["die Schulter","l'épaule"],["der Arm","le bras"],["die Hand","la main"],["der Finger","le doigt"],["der Bauch","le ventre"],["der Rücken","le dos"],["das Bein","la jambe"],["das Knie","le genou"],["der Fuß","le pied"]]},{"n":2,"name":"Tous en forme avec Jean-Lou","v":[["der Sport","le sport"],["der Fitnesskurs","le cours de fitness"],["atmen","respirer"],["schwitzen","transpirer"],["das Herz","le cœur"],["außer Atem","à bout de souffle"],["entspannt","détendu"],["müde","fatigué"],["die rechte Hand","la main droite"],["der linke Fuß","le pied gauche"],["heiß, warm","chaud"],["sich bewegen","bouger"],["springen","sauter"],["die Entspannung","la relaxation"],["das Kissen","le coussin"],["der Lavendel","la lavande"]]},{"n":3,"name":"Aïe, j'ai mal !","v":[["das Bein","la jambe"],["die Schulter","l'épaule"],["der Rücken","le dos"],["der Bauch","le ventre"],["der Hals","la gorge"],["Ich habe Schmerzen","j'ai mal"],["das Bild (Gemälde)","le tableau"],["die Treppe","l'escalier"],["der Schnurrbart","la moustache"],["der Bart","la barbe"],["die Brille","les lunettes"],["der Hut","le chapeau"],["das Kleid","la robe"],["die Hose","le pantalon"],["die Socken","les chaussettes"],["tragen","porter"]]},{"n":4,"name":"Qui est-ce ?","v":[["groß","grand"],["klein","petit"],["alt","âgé"],["jung","jeune"],["muskulös","musclé"],["schlank","mince"],["blond","blond"],["rothaarig","roux"],["lockig","bouclé"],["glatt","lisse"],["kurz","court"],["lang","long"],["der Zopf","la tresse"],["der Pferdeschwanz","la queue de cheval"],["die helle Haut","la peau claire"],["die dunkle Haut","la peau foncée"]]},{"n":5,"name":"La cure de bien-être","v":[["die Seife","le savon"],["der Topf","la casserole"],["die Herdplatte","la plaque de cuisson"],["die Form","le moule"],["gießen","verser"],["mischen","mélanger"],["hinzufügen","ajouter"],["sich ausruhen","se reposer"],["der Vogelgesang","le chant des oiseaux"],["barfuß","pieds nus"],["rutschen","glisser"],["fallen","tomber"],["der Krankenwagen","l'ambulance"],["das Krankenhaus","l'hôpital"],["der Gips","le plâtre"],["die Krücken","les béquilles"]]},{"n":6,"name":"Allô, les secours !","v":[["der Notruf","l'urgence"],["die Rettungsdienste","les secours"],["die Feuerwehr","les pompiers"],["der Krankenwagen","l'ambulance"],["die Telefonnummer","le numéro de téléphone"],["der Nachname","le nom de famille"],["der Vorname","le prénom"],["die Straße","la rue"],["gestern","hier"],["dann","ensuite"],["wir brauchen","nous avons besoin de"],["ich habe gemacht","j'ai fait"],["ich habe genommen","j'ai pris"],["ich habe gesagt","j'ai dit"],["ich habe geschrieben","j'ai écrit"],["ich habe gesehen","j'ai vu"]]}];
let sel=[1],dir="de",state=null;
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>DATA.filter(d=>sel.includes(d.n)).flatMap(d=>d.v);
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();
const Q=v=>dir==="de"?v[0]:v[1], A=v=>dir==="de"?v[1]:v[0];
function menu(){
 app.innerHTML='<p><b>1. Partie(s) wählen</b></p><div class="row">'+DATA.map(d=>'<button class="'+(sel.includes(d.n)?'on':'')+'" onclick="tog('+d.n+')">'+d.n+' · '+d.name+'</button>').join("")+'</div><p><b>2. Richtung</b></p><div class="row"><button class="'+(dir==="de"?'on':'')+'" onclick="dir=\'de\';menu()">Deutsch → Français</button><button class="'+(dir==="fr"?'on':'')+'" onclick="dir=\'fr\';menu()">Français → Deutsch</button></div><p><b>3. Spiel</b></p><div class="row">'+[["memory","🃏","Memory"],["paires","🔗","Paires"],["eclair","⚡","Blitz (60 s)"],["pendu","🔤","Pendu"],["ecris","✍️","Écris-le"]].map(g=>'<button class="tile big" onclick="'+g[0]+'()">'+g[1]+'<br>'+g[2]+'</button>').join("")+'</div><p class="small">'+pool().length+' Wörter ausgewählt.</p>';
}
function tog(n){sel=sel.includes(n)?sel.filter(x=>x!==n):sel.concat(n);if(!sel.length)sel=[n];menu()}
const back='<div class="row"><button onclick="menu()">⬅ Menü</button></div>';
// Memory
function memory(){const p=shuf(pool()).slice(0,8);const cards=shuf(p.flatMap((v,i)=>[{i,t:v[0]},{i,t:v[1]}]));state={cards,open:[],found:0,moves:0,lock:false};drawM()}
function drawM(){app.innerHTML=back+'<div class="grid">'+state.cards.map((c,k)=>'<div class="card '+(c.done?'done':state.open.includes(k)?'':'back')+'" onclick="flip('+k+')">'+(c.done||state.open.includes(k)?c.t:'')+'</div>').join("")+'</div><p class="msg">Züge: '+state.moves+(state.found==8?' · 🎉 Bravo !':'')+'</p>'}
function flip(k){if(state.lock||state.open.includes(k))return;state.open.push(k);drawM();if(state.open.length==2){state.moves++;const[a,b]=state.open;if(state.cards[a].i==state.cards[b].i){state.cards[a].done=state.cards[b].done=1;state.found++;state.open=[];setTimeout(drawM,300)}else{state.lock=true;setTimeout(()=>{state.open=[];state.lock=false;drawM()},1100)}}}
// Paires
function paires(){const p=shuf(pool()).slice(0,6);state={p,l:shuf(p.map((v,i)=>({i,t:Q(v)}))),r:shuf(p.map((v,i)=>({i,t:A(v)}))),a:null,b:null,done:0};drawP()}
function drawP(msg){const col=(arr,s)=>arr.map((c,k)=>'<div class="card '+(c.done?'done ok':state[s]===k?'sel':'')+'" onclick="pick(\''+s+'\','+k+')">'+c.t+'</div>').join("");app.innerHTML=back+'<div class="row" style="align-items:flex-start"><div style="flex:1;display:grid;gap:8px">'+col(state.l,"a")+'</div><div style="flex:1;display:grid;gap:8px">'+col(state.r,"b")+'</div></div><p class="msg">'+(state.done==6?'🎉 Bravo !':msg||'')+'</p>'}
function pick(s,k){state[s]=k;if(state.a!==null&&state.b!==null){const L=state.l[state.a],R=state.r[state.b];if(L.i==R.i){L.done=R.done=1;state.done++;state.a=state.b=null;drawP("✔")}else{state.a=state.b=null;drawP("✘ Nochmal !")}}else drawP()}
// Blitz
function eclair(){state={t:60,score:0,wrong:0,q:null};nextE();state.timer=setInterval(()=>{state.t--;if(state.t<=0){clearInterval(state.timer);app.innerHTML=back+'<p class="msg">⏱ Fertig ! '+state.score+' richtig, '+state.wrong+' falsch.</p><div class="row"><button class="big" onclick="eclair()">Nochmal</button></div>'}else{const e=$("#t");if(e)e.textContent=state.t}},1000)}
function nextE(){const P=pool(),v=P[Math.floor(Math.random()*P.length)];const wr=shuf(P.filter(x=>x!==v)).slice(0,3);state.q=v;state.opts=shuf([v].concat(wr));drawE()}
function drawE(){app.innerHTML='<div class="row"><button onclick="clearInterval(state.timer);menu()">⬅ Menü</button></div><p class="msg">⏱ <span id="t">'+state.t+'</span> · ✔ '+state.score+'</p><div class="q">'+Q(state.q)+'</div><div class="grid">'+state.opts.map((o,k)=>'<div class="card" id="o'+k+'" onclick="ans('+k+')">'+A(o)+'</div>').join("")+'</div>'}
function ans(k){const ok=state.opts[k]===state.q;if(ok)state.score++;else state.wrong++;$("#o"+k).classList.add(ok?"ok":"no");setTimeout(nextE,350)}
// Pendu
function pendu(){const P=pool().filter(v=>/^[a-zàâçéèêëîïôûùüœ' -]+$/i.test(A(v)||""));const v=P.length?P[Math.floor(Math.random()*P.length)]:pool()[0];state={v,w:A(v).toLowerCase(),g:[],bad:0};drawD()}
function drawD(){const w=state.w,shown=[...w].map(ch=>/[a-zàâçéèêëîïôûùüœ]/.test(ch)?(state.g.includes(ch)?ch:'_'):ch).join(' ');const win=!shown.includes('_'),lose=state.bad>=7;const faces=['😀','🙂','😐','😟','😨','😰','😱','💀'];app.innerHTML=back+'<div class="q">'+Q(state.v)+'</div><div class="msg" style="font-size:34px;letter-spacing:2px">'+(lose?w:shown)+'</div><p class="msg">'+faces[state.bad]+' '+(win?'🎉 Bravo !':lose?'Verloren':'Fehler: '+state.bad+' / 7')+'</p><div class="row letters" style="justify-content:center">'+"abcdefghijklmnopqrstuvwxyzéèêàçîôùœ".split("").map(l=>'<button '+(state.g.includes(l)||win||lose?'disabled':'')+' onclick="gl(\''+l+'\')">'+l+'</button>').join("")+'</div>'+(win||lose?'<div class="row"><button class="big" onclick="pendu()">Nochmal</button></div>':'')}
function gl(l){state.g.push(l);if(!state.w.includes(l))state.bad++;drawD()}
// Écris-le
function ecris(){state={p:shuf(pool()),i:0,s:0};drawW()}
function drawW(msg,cls){if(state.i>=state.p.length){app.innerHTML=back+'<p class="msg">🎉 '+state.s+' / '+state.p.length+' richtig</p><div class="row"><button class="big" onclick="ecris()">Nochmal</button></div>';return}const v=state.p[state.i];app.innerHTML=back+'<p class="small">'+(state.i+1)+' / '+state.p.length+'</p><div class="q">'+Q(v)+'</div><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key===\'Enter\')chk()"><div class="row"><button class="big on" onclick="chk()">OK</button><button onclick="hint()">💡 Tipp</button></div><p class="msg '+(cls||'')+'">'+(msg||'')+'</p>';$("#in").focus()}
let hn=0;function hint(){const a=A(state.p[state.i]);hn++;drawW('Anfang: '+a.slice(0,hn)+'…');}
function chk(){const v=state.p[state.i],ok=norm($("#in").value)===norm(A(v));if(ok){if(!hn)state.s++;hn=0;state.i++;drawW("✔","ok")}else drawW("✘ Nochmal oder 💡 Tipp","no")}
menu();
</script></body></html>
